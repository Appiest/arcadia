      <stop offset=".45" stop-color="#ffc463" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffc463" stop-opacity="0"/>
    </radialGradient>
    <filter id="card" x="-25%" y="-12%" width="150%" height="124%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="grown"/>
      <feFlood flood-color="#fbf7ec" result="white"/>
      <feComposite in="white" in2="grown" operator="in" result="cardFill"/>
      <feMorphology in="grown" operator="dilate" radius=".45" result="edge"/>
      <feFlood flood-color="#2b2117" flood-opacity=".55"/>
      <feComposite in2="edge" operator="in" result="cardEdge"/>
      <feGaussianBlur in="edge" stdDeviation="1.4" result="soft"/>
      <feOffset in="soft" dx="1.6" dy="1.4" result="shadowShape"/>
