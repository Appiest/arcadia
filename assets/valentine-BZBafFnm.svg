      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .1  0 0 0 -1.3 .78" result="dark"/>
      <feComposite in="dark" in2="SourceAlpha" operator="in" result="speck"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="speck"/></feMerge>
    </filter>
    <filter id="soften"><feGaussianBlur stdDeviation=".25"/></filter>
