<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38 -192 76 76"><defs>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
      <stop offset=".32" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="clayShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".7" stop-color="#3a2a1a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3a2a1a" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".5" stop-color="#000"/>
      <stop offset=".75" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="rightSide" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" fill="url(#fadeRight)"/>
    </mask>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="1.7" height="1.7" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="1.7" stroke="#2b2117" stroke-width=".42" stroke-opacity=".6"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffc463" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffc463" stop-opacity="0"/>
    </radialGradient>
    <filter id="card" x="-25%" y="-12%" width="150%" height="124%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="grown"/>
      <feFlood flood-color="#fbf7ec" result="white"/>
      <feComposite in="white" in2="grown" operator="in" result="cardFill"/>
      <feMorphology in="grown" operator="dilate" radius=".45" result="edge"/>
      <feFlood flood-color="#2b2117" flood-opacity=".55"/>
      <feComposite in2="edge" operator="in" result="cardEdge"/>
      <feGaussianBlur in="edge" stdDeviation="1.4" result="soft"/>
      <feOffset in="soft" dx="1.6" dy="1.4" result="shadowShape"/>
      <feFlood flood-color="#000" flood-opacity=".28"/>
      <feComposite in2="shadowShape" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="cardEdge"/><feMergeNode in="cardFill"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="G" result="wobble"/>
