      <feComposite in="pulpTint" in2="wobble" operator="in" result="pulpOnFig"/>
      <feMerge><feMergeNode in="wobble"/><feMergeNode in="pulpOnFig"/></feMerge>
    </filter>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
